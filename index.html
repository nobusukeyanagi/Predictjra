<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#174c35">
  <title>YANAGI SYSTEM FOR JRA</title>
  <script>
    // Always request the current stylesheet instead of reusing a stale browser cache.
    const stylesheet = document.createElement('link');
    stylesheet.rel = 'stylesheet';
    stylesheet.href = `./styles.css?v=${Date.now()}`;
    document.head.appendChild(stylesheet);
  </script>
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <button class="site-title" id="back-to-top" type="button" aria-label="ページ先頭へ戻る">YANAGI SYSTEM FOR JRA</button>
    </header>

    <div id="app" aria-live="polite">
      <p class="loading">データを読み込んでいます…</p>
    </div>

  </main>
  <script>
    // app.js also contains race-modal logic, so never reuse a stale cached copy.
    const appScript = document.createElement('script');
    appScript.src = `./app.js?v=${Date.now()}`;
    appScript.defer = true;
    document.body.appendChild(appScript);
  </script>
</body>
</html>
