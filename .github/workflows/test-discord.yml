name: Test Discord notification

on:
  workflow_dispatch:
    inputs:
      notification_type:
        description: 'テストする通知'
        required: true
        type: choice
        options:
          - prediction
          - result
        default: prediction

permissions:
  contents: read

jobs:
  test-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord test notification
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_TYPE: ${{ inputs.notification_type }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::Repository secret DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          if [[ "$NOTIFICATION_TYPE" == "result" ]]; then
            CONTENT=$'【テスト通知】\n🏇2026-08-16(日)のJRA予想結果\n**的中数2 / 36**\n**払戻総額26,070円**\n**総回収率24.1%**\nhttps://nobusukeyanagi.github.io/Predictjra/'
          else
            CONTENT=$'【テスト通知】\n🏇2026-08-16(日)のJRA予想を公開しました\nhttps://nobusukeyanagi.github.io/Predictjra/'
          fi

          jq -n --arg content "$CONTENT" '{content: $content}' > "$RUNNER_TEMP/discord-test.json"

          HTTP_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/discord-response.txt" \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST \
            --data-binary "@$RUNNER_TEMP/discord-test.json" \
            "$DISCORD_WEBHOOK_URL")"

          if [[ "$HTTP_CODE" != "204" && "$HTTP_CODE" != "200" ]]; then
            echo "::error::Discord webhook returned HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/discord-response.txt"
            exit 1
          fi

          echo "Discord test notification sent successfully (HTTP $HTTP_CODE)."
