name: Rebuild historical predictions

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'all = 安全な過去スナップショットを全て検証 / range = 期間指定'
        required: true
        type: choice
        options:
          - all
          - range
        default: all
      start_date:
        description: '開始日 YYYY-MM-DD（range のときだけ入力）'
        required: false
        type: string
      end_date:
        description: '終了日 YYYY-MM-DD（range のときだけ入力）'
        required: false
        type: string
      mode:
        description: 'validate = 検証のみ / apply = 本番反映'
        required: true
        type: choice
        options:
          - validate
          - apply
        default: validate

permissions:
  contents: write
  actions: write

concurrency:
  group: rebuild-historical-predictions
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Predictjra
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy

      - name: Checkout historical pre-race archive
        shell: bash
        run: |
          git clone --depth 1 \
            --branch claude/horse-racing-predictor-ak6crm \
            https://github.com/sugaimo15/keibayosoku.git \
            "$RUNNER_TEMP/keibayosoku"

      - name: Resolve mode, range and output paths
        id: args
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$SCOPE" == "range" ]]; then
            if [[ ! "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
               [[ ! "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::scope=range の場合、start_date/end_date を YYYY-MM-DD で指定してください。"
              exit 1
            fi
            if [[ "$START_DATE" > "$END_DATE" ]]; then
              echo "::error::start_date は end_date 以前の日付にしてください。"
              exit 1
            fi
          else
            # all の場合は過去に入力した日付値が残っていても無視する。
            START_DATE=""
            END_DATE=""
          fi

          if [[ "$MODE" == "validate" ]]; then
            cp data/races.json "$RUNNER_TEMP/races-validation.json"
            DATA_PATH="$RUNNER_TEMP/races-validation.json"
            AUDIT_PATH="$RUNNER_TEMP/rebuild-audit.json"
            POP_MODEL_PATH="$RUNNER_TEMP/popularity-model.json"
            DIAGNOSTIC_PATH="$RUNNER_TEMP/rebuild-diagnostics.json"
          else
            DATA_PATH="data/races.json"
            AUDIT_PATH="data/rebuild_audit.json"
            POP_MODEL_PATH="data/popularity_model.json"
            DIAGNOSTIC_PATH="data/rebuild_diagnostics.json"
          fi

          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "data_path=$DATA_PATH" >> "$GITHUB_OUTPUT"
          echo "audit_path=$AUDIT_PATH" >> "$GITHUB_OUTPUT"
          echo "pop_model_path=$POP_MODEL_PATH" >> "$GITHUB_OUTPUT"
          echo "diagnostic_path=$DIAGNOSTIC_PATH" >> "$GITHUB_OUTPUT"

      - name: Rebuild and validate historical races
        shell: bash
        run: |
          python scripts/rebuild_history_20260815_16.py \
            --source-root "$RUNNER_TEMP/keibayosoku" \
            --scope "${{ steps.args.outputs.scope }}" \
            --start-date "${{ steps.args.outputs.start_date }}" \
            --end-date "${{ steps.args.outputs.end_date }}" \
            --data-path "${{ steps.args.outputs.data_path }}" \
            --audit-path "${{ steps.args.outputs.audit_path }}" \
            --pop-model-path "${{ steps.args.outputs.pop_model_path }}" \
            --diagnostic-path "${{ steps.args.outputs.diagnostic_path }}"

      - name: Write result to Actions Summary
        if: always()
        shell: bash
        env:
          AUDIT_PATH: ${{ steps.args.outputs.audit_path }}
          DIAGNOSTIC_PATH: ${{ steps.args.outputs.diagnostic_path }}
          MODE: ${{ steps.args.outputs.mode }}
          SCOPE: ${{ steps.args.outputs.scope }}
          START_DATE: ${{ steps.args.outputs.start_date }}
          END_DATE: ${{ steps.args.outputs.end_date }}
          SOURCE_ROOT: ${{ runner.temp }}/keibayosoku
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          audit_path = Path(os.environ.get("AUDIT_PATH", ""))
          diagnostic_path = Path(os.environ.get("DIAGNOSTIC_PATH", ""))
          source_root = Path(os.environ["SOURCE_ROOT"])
          pred_root = source_root / "data" / "predictions"

          available = []
          if pred_root.exists():
              for path in sorted(pred_root.iterdir()):
                  if path.is_dir() and re.fullmatch(r"20\d{6}", path.name) and any(path.glob("*.csv")):
                      try:
                          available.append(datetime.strptime(path.name, "%Y%m%d").date().isoformat())
                      except ValueError:
                          pass

          if audit_path.is_file():
              audit = json.loads(audit_path.read_text(encoding="utf-8"))
              summary = audit["summary"]
              daily = audit["daily"]
              mode_label = "検証のみ（サイト未反映）" if os.environ["MODE"] == "validate" else "本番反映"
              dates = audit.get("targetDates", [])
              period = f"{dates[0]} ～ {dates[-1]}" if dates else "-"

              lines = [
                  "# Predictjra 過去レース再計算",
                  "",
                  f"- モード: **{mode_label}**",
                  f"- 対象: **{period}**（{summary['dates']}開催日 / {summary['races']}レース）",
                  "",
                  "## 回収率",
                  "",
                  "| 日付 | レース | 的中 | 投資 | 払戻 | 回収率 |",
                  "|---|---:|---:|---:|---:|---:|",
              ]
              for date_s in sorted(daily):
                  row = daily[date_s]
                  lines.append(
                      f"| {date_s} | {row['races']} | {row['hits']} | "
                      f"{row['stake']:,}円 | {row['return']:,}円 | **{row['recoveryRate']:.1f}%** |"
                  )
              lines.extend([
                  f"| **合計** | **{summary['races']}** | **{summary['hits']}** | "
                  f"**{summary['stake']:,}円** | **{summary['return']:,}円** | "
                  f"**{summary['recoveryRate']:.1f}%** |",
                  "",
              ])
              skipped = audit.get("skippedDates", [])
              if skipped:
                  lines.extend([
                      "## 安全性チェックで除外した日程",
                      "",
                  ])
                  for item in skipped:
                      lines.append(f"- **{item['date']}**: {item['reason']}")
                  lines.append("")
              ignored = audit.get("ignoredFiles", [])
              if ignored:
                  lines.extend([
                      "## 無視した非レースCSV",
                      "",
                  ])
                  for item in ignored:
                      lines.append(f"- **{item['date']}**: {', '.join(item.get('files', []))}")
                  lines.append("")
              lines.extend([
                  "## 想定人気モデル検証",
                  "",
                  f"- 平均人気順位誤差: **{audit['popularityModel']['meanAbsolutePopularityRankError']:.4f}**",
                  f"- 想定人気Top3一致率: **{audit['popularityModel']['meanTop3OverlapRate'] * 100:.1f}%**",
                  "",
                  "> validate モードでは data/races.json を変更せず、この結果だけを確認できます。",
              ])
          else:
              scope = os.environ.get("SCOPE") or "-"
              start = os.environ.get("START_DATE") or "-"
              end = os.environ.get("END_DATE") or "-"
              lines = [
                  "# Predictjra 過去レース再計算 — 失敗",
                  "",
                  "再計算結果は作成されませんでした。",
                  "",
                  f"- scope: **{scope}**",
                  f"- 指定期間: **{start} ～ {end}**",
                  "",
              ]
              if available:
                  lines.extend([
                      "## 利用可能な過去予想日",
                      "",
                      ", ".join(available),
                      "",
                  ])
              if diagnostic_path.is_file():
                  try:
                      diagnostic = json.loads(diagnostic_path.read_text(encoding="utf-8"))
                      lines.extend([
                          "## 診断",
                          "",
                          f"- stage: `{diagnostic.get('stage', '-')}`",
                          f"- errorCount: `{diagnostic.get('errorCount', '-')}`",
                      ])
                      skipped = diagnostic.get("skippedDates", [])
                      if skipped:
                          lines.extend(["", "### 安全性チェックで除外した日程", ""])
                          for item in skipped:
                              lines.append(f"- **{item['date']}**: {item['reason']}")
                      errors = diagnostic.get("errors", [])
                      if errors:
                          lines.extend(["", "### 最初のエラー", ""])
                          for item in errors[:10]:
                              lines.append(
                                  f"- `{item.get('raceId', '-')}` "
                                  f"{item.get('errorType', 'Error')}: {item.get('message', '')}"
                              )
                          if len(errors) > 10:
                              lines.append(f"- …ほか {len(errors) - 10} 件")
                      lines.append("")
                  except Exception:
                      pass
              lines.append(
                  "> 詳細はこのRunの `historical-rebuild-*` Artifactにある診断JSONでも確認できます。"
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Upload validation/rebuild report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historical-rebuild-${{ steps.args.outputs.mode }}
          path: |
            ${{ steps.args.outputs.audit_path }}
            ${{ steps.args.outputs.pop_model_path }}
            ${{ steps.args.outputs.diagnostic_path }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Detect apply changes
        if: steps.args.outputs.mode == 'apply'
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            data/races.json \
            data/rebuild_audit.json \
            data/popularity_model.json \
            data/rebuild_diagnostics.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No production changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Production data changed."
          fi

      - name: Commit rebuilt production data
        if: steps.args.outputs.mode == 'apply' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/races.json \
            data/rebuild_audit.json \
            data/popularity_model.json \
            data/rebuild_diagnostics.json
          git commit -m "Rebuild historical JRA predictions"
          git push

      - name: Redeploy Pages after apply
        if: steps.args.outputs.mode == 'apply' && steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
