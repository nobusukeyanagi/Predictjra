name: Rebuild historical predictions

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'all = 2026年1月以降の完全検証済み過去日を全て検証 / range = 期間指定'
        required: true
        type: choice
        options:
          - all
          - range
        default: all
      start_date:
        description: '開始日 YYYY-MM-DD（range のときだけ入力）'
        required: false
        type: string
      end_date:
        description: '終了日 YYYY-MM-DD（range のときだけ入力）'
        required: false
        type: string
      mode:
        description: 'validate = 検証のみ / apply = 本番反映'
        required: true
        type: choice
        options:
          - validate
          - apply
        default: validate
      cache_policy:
        description: 'auto = 保存済み事実データを再利用 / refresh = 元アーカイブから事実データを更新'
        required: true
        type: choice
        options:
          - auto
          - refresh
        default: auto

permissions:
  contents: write
  actions: write

concurrency:
  group: rebuild-historical-predictions
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Predictjra
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pandas numpy

      - name: Validate candidate prediction rules
        run: |
          python scripts/test_prediction_logic.py
          python scripts/test_popularity_v54.py

      - name: Verify historical backfill implementation
        shell: bash
        run: |
          test -f scripts/test_build_history_cache_backfill.py || {
            echo "::error::v53.5 backfill test file is missing. Re-upload the complete v53.5 diff."
            exit 1
          }
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path("scripts/build_history_cache.py")
          text = path.read_text(encoding="utf-8")
          m = re.search(r'^CACHE_VERSION\s*=\s*"([^"]+)"', text, re.MULTILINE)
          actual = m.group(1) if m else ""
          expected = "predictjra-historical-facts-v8-jra-official-executed"
          if actual != expected:
              raise SystemExit(
                  f"::error::build_history_cache.py version mismatch: {actual or 'unknown'} != {expected}"
              )
          print(f"Backfill cache implementation: {actual}")
          PY

      - name: Validate historical backfill safety rules
        run: PYTHONPATH=scripts python scripts/test_build_history_cache_backfill.py

      - name: Resolve mode, range and output paths
        id: args
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          MODE: ${{ inputs.mode }}
          CACHE_POLICY: ${{ inputs.cache_policy }}
        run: |
          if [[ "$SCOPE" == "range" ]]; then
            if [[ ! "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
               [[ ! "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::scope=range の場合、start_date/end_date を YYYY-MM-DD で指定してください。"
              exit 1
            fi
            if [[ "$START_DATE" > "$END_DATE" ]]; then
              echo "::error::start_date は end_date 以前の日付にしてください。"
              exit 1
            fi
          else
            START_DATE=""
            END_DATE=""
          fi

          if [[ "$MODE" == "validate" ]]; then
            cp data/races.json "$RUNNER_TEMP/races-validation.json"
            DATA_PATH="$RUNNER_TEMP/races-validation.json"
            AUDIT_PATH="$RUNNER_TEMP/rebuild-audit.json"
            POP_MODEL_PATH="$RUNNER_TEMP/popularity-model.json"
            POP_MODEL_BIN_PATH="$RUNNER_TEMP/popularity-model-v54.joblib"
            TIME_BASELINE_PATH="$RUNNER_TEMP/time-baselines.json"
            DIAGNOSTIC_PATH="$RUNNER_TEMP/rebuild-diagnostics.json"
          else
            DATA_PATH="data/races.json"
            AUDIT_PATH="data/rebuild_audit.json"
            POP_MODEL_PATH="data/popularity_model.json"
            POP_MODEL_BIN_PATH="data/popularity_model_v54.joblib"
            TIME_BASELINE_PATH="data/time_baselines.json"
            DIAGNOSTIC_PATH="data/rebuild_diagnostics.json"
          fi

          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "cache_policy=$CACHE_POLICY" >> "$GITHUB_OUTPUT"
          echo "data_path=$DATA_PATH" >> "$GITHUB_OUTPUT"
          echo "audit_path=$AUDIT_PATH" >> "$GITHUB_OUTPUT"
          echo "pop_model_path=$POP_MODEL_PATH" >> "$GITHUB_OUTPUT"
          echo "pop_model_bin_path=$POP_MODEL_BIN_PATH" >> "$GITHUB_OUTPUT"
          echo "time_baseline_path=$TIME_BASELINE_PATH" >> "$GITHUB_OUTPUT"
          echo "diagnostic_path=$DIAGNOSTIC_PATH" >> "$GITHUB_OUTPUT"

      - name: Stage candidate as production for apply
        if: steps.args.outputs.mode == 'apply'
        shell: bash
        run: |
          # This changes only the runner worktree. Remote production is untouched unless
          # every subsequent Rebuild step succeeds and the final commit is pushed.
          cp scripts/prediction_logic_candidate.py scripts/prediction_logic_production.py
          cmp -s scripts/prediction_logic_candidate.py scripts/prediction_logic_production.py
          python scripts/test_prediction_logic_production.py
          python scripts/test_predict_engine.py

      - name: Decide whether historical facts cache must be refreshed
        id: cache
        shell: bash
        env:
          CACHE_POLICY: ${{ steps.args.outputs.cache_policy }}
          SCOPE: ${{ steps.args.outputs.scope }}
          START_DATE: ${{ steps.args.outputs.start_date }}
          END_DATE: ${{ steps.args.outputs.end_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("data/history_cache/manifest.json")
          policy = os.environ["CACHE_POLICY"]
          scope = os.environ["SCOPE"]
          start = os.environ.get("START_DATE", "")
          end = os.environ.get("END_DATE", "")

          refresh = policy == "refresh"
          reason = "cache_policy=refresh" if refresh else ""
          manifest = None

          if not refresh:
              if not manifest_path.is_file():
                  refresh = True
                  reason = "cache manifest does not exist"
              else:
                  try:
                      manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  except Exception:
                      refresh = True
                      reason = "cache manifest is unreadable"

          if not refresh and manifest is not None:
              expected_cache_version = "predictjra-historical-facts-v8-jra-official-executed"
              if manifest.get("cacheVersion") != expected_cache_version:
                  refresh = True
                  reason = (
                      "historical cache format changed: "
                      f"{manifest.get('cacheVersion') or 'unknown'} -> {expected_cache_version}"
                  )

          if not refresh and manifest is not None:
              archive = manifest.get("archive") or {}
              path = archive.get("path")
              parts = archive.get("parts") or []
              if path:
                  if not (manifest_path.parent / path).is_file():
                      refresh = True
                      reason = "cache archive is missing"
              elif parts:
                  if any(not (manifest_path.parent / p).is_file() for p in parts):
                      refresh = True
                      reason = "one or more cache archive parts are missing"
              else:
                  refresh = True
                  reason = "cache archive location is missing from manifest"

          # auto でも、元アーカイブのbranch HEADが変わったときだけ軽量確認して更新する。
          # 全CSVのclone/走査はHEADが同じ限り行わない。
          if not refresh and manifest is not None and policy == "auto":
              import subprocess
              try:
                  output = subprocess.check_output([
                      "git", "ls-remote",
                      "https://github.com/sugaimo15/keibayosoku.git",
                      "refs/heads/claude/horse-racing-predictor-ak6crm",
                  ], text=True, timeout=30).strip()
                  remote_commit = output.split()[0] if output else ""
                  cached_commit = str(manifest.get("sourceCommit") or "")
                  if remote_commit and cached_commit and remote_commit != cached_commit:
                      refresh = True
                      reason = "historical source branch has changed"
              except Exception as exc:
                  print(f"::warning::Could not check historical source HEAD; reusing cache: {exc}")

          # range で現在のキャッシュ範囲外の日付を指定した場合は自動更新する。
          if not refresh and manifest is not None and scope == "range":
              safe = sorted(manifest.get("safeDates") or [])
              if not safe or start < safe[0] or end > safe[-1]:
                  refresh = True
                  reason = "requested range extends beyond cached dates"

          if not refresh:
              reason = "reusing durable historical facts cache"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"refresh={'true' if refresh else 'false'}\n")
              f.write(f"reason={reason}\n")
          print(f"refresh={refresh}: {reason}")
          PY

      - name: Checkout historical source archive
        if: steps.cache.outputs.refresh == 'true'
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/keibayosoku"
          for attempt in 1 2 3; do
            if git clone --depth 1 \
              --branch claude/horse-racing-predictor-ak6crm \
              https://github.com/sugaimo15/keibayosoku.git \
              "$RUNNER_TEMP/keibayosoku"; then
              break
            fi
            echo "::warning::Historical source clone failed (attempt $attempt/3). Retrying."
            rm -rf "$RUNNER_TEMP/keibayosoku"
            sleep $((attempt * 5))
          done
          test -d "$RUNNER_TEMP/keibayosoku/.git" || {
            echo "::error::Historical source could not be cloned after 3 attempts."
            exit 1
          }

      - name: Refresh immutable historical facts cache
        if: steps.cache.outputs.refresh == 'true'
        shell: bash
        run: |
          python scripts/build_history_cache.py \
            --source-root "$RUNNER_TEMP/keibayosoku" \
            --cache-dir data/history_cache

      - name: Restore cached historical source tree
        id: restore-cache
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          cache_dir = Path("data/history_cache")
          manifest = json.loads((cache_dir / "manifest.json").read_text(encoding="utf-8"))
          archive = manifest.get("archive") or {}
          out = Path(os.environ["RUNNER_TEMP"]) / "history-source.tar.gz"

          if archive.get("path"):
              src = cache_dir / archive["path"]
              out.write_bytes(src.read_bytes())
          else:
              parts = archive.get("parts") or []
              if not parts:
                  raise RuntimeError("historical cache manifest has no archive or parts")
              with out.open("wb") as dst:
                  for name in parts:
                      dst.write((cache_dir / name).read_bytes())

          h = hashlib.sha256()
          with out.open("rb") as f:
              while True:
                  chunk = f.read(1024 * 1024)
                  if not chunk:
                      break
                  h.update(chunk)
          actual = h.hexdigest()
          expected = archive.get("sha256")
          if expected and actual != expected:
              raise RuntimeError(f"historical cache SHA256 mismatch: {actual} != {expected}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"source_commit={manifest.get('sourceCommit', '')}\n")
              f.write(f"safe_dates={len(manifest.get('safeDates') or [])}\n")
              f.write(f"archive_size={int(archive.get('sizeBytes') or out.stat().st_size)}\n")
          PY

          rm -rf "$RUNNER_TEMP/history-cache-source"
          mkdir -p "$RUNNER_TEMP/history-cache-source"
          tar -xzf "$RUNNER_TEMP/history-source.tar.gz" -C "$RUNNER_TEMP/history-cache-source"

      - name: Rebuild and validate historical races from cache
        shell: bash
        run: |
          python scripts/rebuild_history.py \
            --source-root "$RUNNER_TEMP/history-cache-source" \
            --source-commit "${{ steps.restore-cache.outputs.source_commit }}" \
            --cache-manifest data/history_cache/manifest.json \
            --scope "${{ steps.args.outputs.scope }}" \
            --start-date "${{ steps.args.outputs.start_date }}" \
            --end-date "${{ steps.args.outputs.end_date }}" \
            --data-path "${{ steps.args.outputs.data_path }}" \
            --audit-path "${{ steps.args.outputs.audit_path }}" \
            --pop-model-path "${{ steps.args.outputs.pop_model_path }}" \
            --pop-model-bin-path "${{ steps.args.outputs.pop_model_bin_path }}" \
            --time-baseline-path "${{ steps.args.outputs.time_baseline_path }}" \
            --diagnostic-path "${{ steps.args.outputs.diagnostic_path }}"

      - name: Write result to Actions Summary
        if: always()
        shell: bash
        env:
          AUDIT_PATH: ${{ steps.args.outputs.audit_path }}
          DIAGNOSTIC_PATH: ${{ steps.args.outputs.diagnostic_path }}
          MODE: ${{ steps.args.outputs.mode }}
          SCOPE: ${{ steps.args.outputs.scope }}
          START_DATE: ${{ steps.args.outputs.start_date }}
          END_DATE: ${{ steps.args.outputs.end_date }}
          CACHE_REFRESH: ${{ steps.cache.outputs.refresh }}
          CACHE_REASON: ${{ steps.cache.outputs.reason }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          audit_path = Path(os.environ.get("AUDIT_PATH", ""))
          diagnostic_path = Path(os.environ.get("DIAGNOSTIC_PATH", ""))
          manifest_path = Path("data/history_cache/manifest.json")
          manifest = {}
          if manifest_path.is_file():
              try:
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              except Exception:
                  pass

          cache_refresh = os.environ.get("CACHE_REFRESH") == "true"
          cache_label = "今回更新" if cache_refresh else "保存済みキャッシュを再利用"
          archive = manifest.get("archive") or {}
          archive_mb = float(archive.get("sizeBytes") or 0) / 1024 / 1024

          import hashlib
          candidate_path = Path("scripts/prediction_logic_candidate.py")
          production_path = Path("scripts/prediction_logic_production.py")
          def short_sha(path):
              if not path.is_file():
                  return "missing"
              return hashlib.sha256(path.read_bytes()).hexdigest()[:12]
          candidate_sha = short_sha(candidate_path)
          production_sha = short_sha(production_path)
          if os.environ["MODE"] == "apply":
              logic_state = "候補ロジックを本番へ昇格（成功時にcommit）"
          elif candidate_sha == production_sha:
              logic_state = "候補 = 現行本番"
          else:
              logic_state = "候補 ≠ 現行本番（本番には未反映）"

          if audit_path.is_file():
              audit = json.loads(audit_path.read_text(encoding="utf-8"))
              summary = audit["summary"]
              daily = audit["daily"]
              mode_label = "検証のみ（サイト未反映）" if os.environ["MODE"] == "validate" else "本番反映"
              dates = audit.get("targetDates", [])
              period = f"{dates[0]} ～ {dates[-1]}" if dates else "-"

              lines = [
                  "# Predictjra 過去レース再計算",
                  "",
                  f"- モード: **{mode_label}**",
                  f"- 対象: **{period}**（{summary['dates']}開催日 / {summary['races']}レース）",
                  f"- 過去事実データ: **{cache_label}**",
                  f"- キャッシュ: **{len(manifest.get('safeDates') or [])}開催日 / {archive_mb:.1f} MB**",
                  f"- 2026年1月以降Backfill: **{len(manifest.get('resultDerivedDates') or [])}開催日**（確定結果からレース前固定項目だけを再構成）",
                  f"- 欠損補完: **{int((manifest.get('webRepair') or {}).get('repairedRaceCount') or 0)}レース**（SportsNavi → netkeiba、必要な片側だけ補完）",
          f"- 中止・取りやめ正常除外: **{int((manifest.get('webRepair') or {}).get('cancelledRaceCount') or 0)}レース**（JRA公式開催日程で確認）",
                  f"- サニタイズ: 当日オッズ・実人気・馬体重・旧モデル出力をキャッシュ/予想入力から除外",
                  f"- ロジック状態: **{logic_state}**",
                  f"- 候補SHA: `{candidate_sha}` / 本番SHA: `{production_sha}`",
                  "",
                  "## 回収率",
                  "",
                  "| 日付 | レース | 的中 | 投資 | 払戻 | 回収率 |",
                  "|---|---:|---:|---:|---:|---:|",
              ]
              for date_s in sorted(daily):
                  row = daily[date_s]
                  lines.append(
                      f"| {date_s} | {row['races']} | {row['hits']} | "
                      f"{row['stake']:,}円 | {row['return']:,}円 | **{row['recoveryRate']:.1f}%** |"
                  )
              lines.extend([
                  f"| **合計** | **{summary['races']}** | **{summary['hits']}** | "
                  f"**{summary['stake']:,}円** | **{summary['return']:,}円** | "
                  f"**{summary['recoveryRate']:.1f}%** |",
                  "",
              ])

              skipped = manifest.get("skippedDates", [])
              if skipped:
                  lines.extend(["## 完全性エラー", ""])
                  for item in skipped:
                      lines.append(f"- **{item['date']}**: {item['reason']}")
                  lines.append("")
              else:
                  lines.extend(["- 隔離日程: **0件**（全対象日を完全性検証済み）", ""])

              lines.extend([
                  "## 想定人気モデル検証",
                  "",
                  f"- 平均人気順位誤差: **{audit['popularityModel']['meanAbsolutePopularityRankError']:.4f}**",
                  f"- 想定人気Top3一致率: **{audit['popularityModel']['meanTop3OverlapRate'] * 100:.1f}%**",
                  "",
                  "> 過去の出走表・成績・払戻等はキャッシュを再利用します。指数・本命・対抗・相手・危険馬・回収率は毎回現在のロジックで再計算します。",
              ])
          else:
              lines = [
                  "# Predictjra 過去レース再計算 — 失敗",
                  "",
                  "再計算結果は作成されませんでした。",
                  "",
                  f"- scope: **{os.environ.get('SCOPE') or '-'}**",
                  f"- 指定期間: **{os.environ.get('START_DATE') or '-'} ～ {os.environ.get('END_DATE') or '-'}**",
                  f"- キャッシュ処理: **{cache_label}**",
                  f"- cache reason: `{os.environ.get('CACHE_REASON') or '-'}`",
                  "",
              ]
              safe = manifest.get("safeDates") or []
              if safe:
                  lines.extend(["## キャッシュ済みの安全な日程", "", ", ".join(safe), ""])
              if diagnostic_path.is_file():
                  try:
                      diagnostic = json.loads(diagnostic_path.read_text(encoding="utf-8"))
                      lines.extend([
                          "## 診断",
                          "",
                          f"- stage: `{diagnostic.get('stage', '-')}`",
                          f"- errorCount: `{diagnostic.get('errorCount', '-')}`",
                      ])
                      errors = diagnostic.get("errors", [])
                      if errors:
                          lines.extend(["", "### 最初のエラー", ""])
                          for item in errors[:10]:
                              lines.append(
                                  f"- `{item.get('raceId', '-')}` "
                                  f"{item.get('errorType', 'Error')}: {item.get('message', '')}"
                              )
                          if len(errors) > 10:
                              lines.append(f"- …ほか {len(errors) - 10} 件")
                  except Exception:
                      pass
              lines.extend(["", "> 詳細はこのRunの historical-rebuild Artifactでも確認できます。"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Upload validation/rebuild report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historical-rebuild-${{ steps.args.outputs.mode }}
          path: |
            ${{ steps.args.outputs.audit_path }}
            ${{ steps.args.outputs.pop_model_path }}
            ${{ steps.args.outputs.pop_model_bin_path }}
            ${{ steps.args.outputs.time_baseline_path }}
            ${{ steps.args.outputs.diagnostic_path }}
            data/history_cache/manifest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Detect cache, production data and promoted-logic changes
        if: success()
        id: changes
        shell: bash
        env:
          MODE: ${{ steps.args.outputs.mode }}
        run: |
          if [[ -n "$(git status --porcelain -- data/history_cache)" ]]; then
            echo "cache_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$MODE" == "apply" ]] && \
             [[ -n "$(git status --porcelain -- data/races.json data/rebuild_audit.json data/popularity_model.json data/popularity_model_v54.joblib data/time_baselines.json data/rebuild_diagnostics.json)" ]]; then
            echo "production_data_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "production_data_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$MODE" == "apply" ]] && \
             [[ -n "$(git status --porcelain -- scripts/prediction_logic_production.py)" ]]; then
            echo "logic_promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "logic_promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit cache, apply results and promoted production logic
        if: >-
          success() &&
          (steps.changes.outputs.cache_changed == 'true' ||
           steps.changes.outputs.production_data_changed == 'true' ||
           steps.changes.outputs.logic_promoted == 'true')
        shell: bash
        env:
          MODE: ${{ steps.args.outputs.mode }}
          CACHE_CHANGED: ${{ steps.changes.outputs.cache_changed }}
          PRODUCTION_DATA_CHANGED: ${{ steps.changes.outputs.production_data_changed }}
          LOGIC_PROMOTED: ${{ steps.changes.outputs.logic_promoted }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$CACHE_CHANGED" == "true" ]]; then
            git add data/history_cache
          fi
          if [[ "$MODE" == "apply" && "$PRODUCTION_DATA_CHANGED" == "true" ]]; then
            git add \
              data/races.json \
              data/rebuild_audit.json \
              data/popularity_model.json \
              data/popularity_model_v54.joblib \
              data/time_baselines.json \
              data/rebuild_diagnostics.json
          fi
          if [[ "$MODE" == "apply" && "$LOGIC_PROMOTED" == "true" ]]; then
            git add scripts/prediction_logic_production.py
          fi

          if [[ "$MODE" == "apply" && "$LOGIC_PROMOTED" == "true" ]]; then
            MESSAGE="Promote candidate JRA logic and rebuild historical predictions"
          elif [[ "$MODE" == "apply" && "$PRODUCTION_DATA_CHANGED" == "true" ]]; then
            MESSAGE="Rebuild historical JRA predictions"
          else
            MESSAGE="Update historical JRA facts cache"
          fi
          git commit -m "$MESSAGE"
          git push

      - name: Redeploy Pages after apply
        if: >-
          success() &&
          steps.args.outputs.mode == 'apply' &&
          steps.changes.outputs.production_data_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
