name: Backtest second horse 2026-08-01, 02, 15 and 16

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/backtest_second_20260801_02_15_16.py'
      - '.github/workflows/backtest-second-20260801-02-15-16.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-second-20260801-02-15-16
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Predictjra
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy

      - name: Checkout historical pre-race archive
        shell: bash
        run: |
          git clone --depth 1 \
            --branch claude/horse-racing-predictor-ak6crm \
            https://github.com/sugaimo15/keibayosoku.git \
            "$RUNNER_TEMP/keibayosoku"

      - name: Prepare isolated data copy
        shell: bash
        run: cp data/races.json "$RUNNER_TEMP/races.json"

      - name: Backtest 144 races
        shell: bash
        run: |
          python scripts/backtest_second_20260801_02_15_16.py \
            --source-root "$RUNNER_TEMP/keibayosoku" \
            --data-path "$RUNNER_TEMP/races.json" \
            --audit-path data/second_strategy_backtest_20260801_02_15_16.json \
            --pop-model-path "$RUNNER_TEMP/backtest_popularity_model.json" \
            --diagnostic-path data/backtest_second_diagnostics_20260801_02_15_16.json

      - name: Show second-horse strategy summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/second_strategy_backtest_20260801_02_15_16.json')
          a = json.loads(p.read_text(encoding='utf-8'))
          print('raceCount:', a['raceCount'])
          print('daily:', json.dumps(a['daily'], ensure_ascii=False, indent=2))
          print('\nSecond-horse strategies:')
          for name, row in a['secondHorseStrategyBacktest'].items():
              print(
                  f"{name}: hits={row['hits']} "
                  f"return={row['return']} stake={row['stake']} "
                  f"recovery={row['recoveryRate']}% "
                  f"secondTop3={row['secondAxisTop3Rate']}%"
              )
          PY

      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: second-horse-backtest-20260801-02-15-16
          path: |
            data/second_strategy_backtest_20260801_02_15_16.json
            data/backtest_second_diagnostics_20260801_02_15_16.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit backtest report
        shell: bash
        run: |
          if [ ! -f data/second_strategy_backtest_20260801_02_15_16.json ]; then
            echo 'Backtest report was not generated.'
            exit 1
          fi
          if git diff --quiet -- data/second_strategy_backtest_20260801_02_15_16.json; then
            echo 'No backtest report changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/second_strategy_backtest_20260801_02_15_16.json
          git commit -m 'Backtest second-horse strategies on four JRA days'
          git push
