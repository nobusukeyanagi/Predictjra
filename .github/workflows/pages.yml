name: Deploy GitHub Pages

on:
  # デザイン・公開UIをmainへアップロード／コミットしたときだけ即時反映。
  # 予想ロジックやテストコードだけの変更ではDeployしない。
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'assets/**'
      - 'images/**'
      - 'favicon.ico'
      - 'favicon.svg'
      - 'CNAME'

  # 手動再公開、およびRebuildのapply後の再公開
  workflow_dispatch:

  # 通常の自動レース更新完了後に再公開
  workflow_run:
    workflows:
      - 'Update race data'
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build static artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'data/history_cache/' \
            --exclude 'data/market_history.json' \
            --exclude 'data/popularity_model.json' \
            --exclude 'data/popularity_model_v54.joblib' \
            --exclude 'data/rebuild_audit.json' \
            --exclude 'data/rebuild_diagnostics.json' \
            --exclude 'data/time_baselines.json' \
            --exclude 'requirements.txt' \
            --exclude 'README*' \
            --exclude '*.zip' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.DS_Store'

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-discord:
    # Discord通知は通常のレースデータ更新を受けた公開時だけ。
    # デザイン変更・手動公開・過去レースRebuildでは送信しない。
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Update race data' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Download notification payload from data update
        uses: actions/download-artifact@v8
        with:
          name: discord-notification
          path: ${{ runner.temp }}/discord-notification
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord notification after Pages deploy
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FILE="$RUNNER_TEMP/discord-notification/notification.json"
          SEND="$(jq -r '.send // false' "$FILE")"

          if [[ "$SEND" != "true" ]]; then
            echo "Notification is disabled for this update."
            exit 0
          fi

          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::warning::Repository secret DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi

          CONTENT="$(jq -r '.content' "$FILE")"
          jq -n --arg content "$CONTENT" '{content: $content}' > "$RUNNER_TEMP/discord-payload.json"

          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST \
            --data-binary "@$RUNNER_TEMP/discord-payload.json" \
            "$DISCORD_WEBHOOK_URL"
