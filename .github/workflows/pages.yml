name: Deploy GitHub Pages

on:
  # GitHub上で差分ファイルをmainへアップロード／コミットしたら即時反映
  push:
    branches: ['main']

  # 手動再公開も可能
  workflow_dispatch:

  # 前日15時・当日18時の自動データ更新完了後にも再公開
  # GITHUB_TOKENによる自動commitは通常push workflowを連鎖起動しないため、
  # workflow_runでUpdate race dataの完了を直接受ける。
  workflow_run:
    workflows: ['Update race data']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # データ更新に失敗した場合だけは公開しない。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          # 公開用ファイルをまとめてコピーする。
          # 今後画像・JSON・JS等のファイルを差分追加しても、個別にpages.ymlを
          # 書き換えなくても自動でGitHub Pagesへ含まれる。
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'requirements.txt' \
            --exclude 'README.md'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
