name: Deploy GitHub Pages

on:
  # GitHub上で差分ファイルをmainへアップロード／コミットしたら即時反映
  push:
    branches: ['main']

  # 手動再公開も可能
  workflow_dispatch:

  # 前日15時・当日18時の自動データ更新完了後にも再公開
  # GITHUB_TOKENによる自動commitは通常push workflowを連鎖起動しないため、
  # workflow_runでUpdate race dataの完了を直接受ける。
  workflow_run:
    workflows: ['Update race data']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # データ更新に失敗した場合だけは公開しない。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build static artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          # 公開用ファイルをまとめてコピーする。
          # 今後画像・JSON・JS等を差分追加してもpages.ymlの個別修正は不要。
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'requirements.txt' \
            --exclude 'README.md' \
            --exclude '*.zip' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.DS_Store'

          # ソース側に.nojekyllが無くても必ず生成する。
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-discord:
    # Discord通知はレースデータ更新を受けた公開時だけ。通常の差分アップロードでは送信しない。
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Download notification payload from data update
        uses: actions/download-artifact@v8
        with:
          name: discord-notification
          path: ${{ runner.temp }}/discord-notification
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord notification after Pages deploy
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FILE="$RUNNER_TEMP/discord-notification/notification.json"
          SEND="$(jq -r '.send // false' "$FILE")"

          if [[ "$SEND" != "true" ]]; then
            echo "Notification is disabled for this update."
            exit 0
          fi

          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::warning::Repository secret DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi

          CONTENT="$(jq -r '.content' "$FILE")"
          jq -n --arg content "$CONTENT" '{content: $content}' > "$RUNNER_TEMP/discord-payload.json"

          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST \
            --data-binary "@$RUNNER_TEMP/discord-payload.json" \
            "$DISCORD_WEBHOOK_URL"
