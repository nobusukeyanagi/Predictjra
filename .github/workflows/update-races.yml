name: Update race data

on:
  schedule:
    - cron: '0 13 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '0 18 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
    inputs:
      mode:
        description: 'prepare = 出馬表/予想, result = 結果/判定'
        required: true
        type: choice
        options:
          - prepare
          - result
        default: prepare
      target_date:
        description: '対象日 YYYY-MM-DD（空欄なら自動）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-race-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve mode and date
        id: args
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
            DATE="${{ inputs.target_date }}"
          elif [[ "${{ github.event.schedule }}" == "0 13 * * *" ]]; then
            MODE="prepare"
            DATE=""
          else
            MODE="result"
            DATE=""
          fi

          if [[ -z "$DATE" ]]; then
            if [[ "$MODE" == "prepare" ]]; then
              DATE="$(TZ=Asia/Tokyo date -d tomorrow +%F)"
            else
              DATE="$(TZ=Asia/Tokyo date +%F)"
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Resolved: mode=$MODE date=$DATE"

      - name: Fetch and update
        shell: bash
        run: |
          python scripts/update_races.py \
            --mode "${{ steps.args.outputs.mode }}" \
            --date "${{ steps.args.outputs.date }}"

      - name: Detect data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/races.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No race-data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Race data changed."
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races.json
          git commit -m "Update JRA race data (${{ steps.args.outputs.mode }} ${{ steps.args.outputs.date }})"
          git push

      - name: Build Discord notification payload
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/discord-notification"
          if [[ "${{ steps.changes.outputs.changed }}" == "true" ]]; then
            python scripts/build_discord_notification.py \
              --mode "${{ steps.args.outputs.mode }}" \
              --date "${{ steps.args.outputs.date }}" \
              --output "$RUNNER_TEMP/discord-notification/notification.json"
          else
            printf '%s\n' '{"send": false}' > "$RUNNER_TEMP/discord-notification/notification.json"
          fi

      - name: Upload Discord notification payload
        uses: actions/upload-artifact@v7
        with:
          name: discord-notification
          path: ${{ runner.temp }}/discord-notification/notification.json
          retention-days: 1
